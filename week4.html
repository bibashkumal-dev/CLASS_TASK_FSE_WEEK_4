<!DOCTYPE html>
<html>
<head>
    <title>About My Skill</title>

    <style>
        body {
            background-color: lightgray;
            width: 320px;
            margin: 20px auto;
            border: 2px solid gray;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        h2 {
            text-align: center;
            color: green;
        }

        p {
            text-align: center;
        }

        img {
            display: block;
            margin: 10px auto;
            width: 80px;
            height: 80px;
        }

        a {
            display: block;
            text-align: center;
        }
        .navbar{
            width: 98%;
            height: 58px;
            margin: 4px auto 0;
            background-color: #333333;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
            .logo img {
            width: 25px;
            height: 25px;

            object-fit: contain;

            display: block;
        }

        /* ================= NAVIGATION LINK ================= */

            .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;

            position: relative;

        }

            .nav-link a {
            color: blue;

            font-size: 16px;

            font-weight: normal;

            text-decoration: underline;

            cursor: pointer;

        }

        /* ================= RED DOT ================= */

            .dot {
            width: 6px;
            height: 6px;

            background-color: red;

            border-radius: 50%;

            margin-top: 7px;
        
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <!-- Logo -->
         <div class="logo">
            <img src="logo.png" alt="Logo">
         </div>

         <!-- Navigation Link -->
          <div class="nav-link">
            <a href="#">About Skills Website</a>
            <span class="dot"></span>

          </div>
    </nav>

    <h1>BIBASH KUMAL</h1>

    <img src="image.jpg" alt="Student Photo">

    <h2>About Me</h2>

    <p>
        Hello! My name is Bibash Kumal I am a computer science
        student and I am learning HTML, CSS and JavaScript.
    </p>

    <h2>My Skills</h2>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>C#</li>
    </ul>

    <h2>My Website</h2>

    <a href="https://www.google.com">
        Visit My Website
    </a>

</body>
</html>
